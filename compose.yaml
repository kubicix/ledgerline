# Ledgerline local infrastructure and M2 application services.
# Image tags verified on 2026-11-13 (see docs/adr/0000-verified-versions.md).
# All credentials below are local development defaults, never reuse them.
name: ledgerline

services:
  rabbitmq-init:
    profiles: [app]
    image: rabbitmq:4.4-management
    command: [rabbitmqadmin, definitions, import, --file, /etc/rabbitmq/local-events.json]
    restart: "no"
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_USERNAME: ledgerline
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_PASSWORD:-ledgerline_dev}
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
    volumes:
      - ./deploy/compose/rabbitmq/local-events.json:/etc/rabbitmq/local-events.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  accounts-migrate:
    profiles: [app]
    image: ledgerline-accounts:local
    build:
      context: .
      dockerfile: src/Services/Accounts/Ledgerline.Accounts/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=accounts_db;Username=accounts;Password=accounts_dev
    depends_on:
      postgres:
        condition: service_healthy

  payments-migrate:
    profiles: [app]
    image: ledgerline-payments:local
    build:
      context: .
      dockerfile: src/Services/Payments/Ledgerline.Payments/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=payments_db;Username=payments;Password=payments_dev
    depends_on:
      postgres:
        condition: service_healthy

  accounts:
    profiles: [app]
    image: ledgerline-accounts:local
    build:
      context: .
      dockerfile: src/Services/Accounts/Ledgerline.Accounts/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=accounts_db;Username=accounts;Password=accounts_dev
      Messaging__RabbitMq__Uri: amqp://ledgerline:${RABBITMQ_PASSWORD:-ledgerline_dev}@rabbitmq:5672/
      Auth__Mode: Oidc
      ConnectionStrings__Redis: redis:6379
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      accounts-migrate:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck: &app-health
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  payments:
    profiles: [app]
    image: ledgerline-payments:local
    build:
      context: .
      dockerfile: src/Services/Payments/Ledgerline.Payments/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=payments_db;Username=payments;Password=payments_dev
      Bank__BaseUrl: http://banksim:8080
      Bank__ApiKey: ${BANK_API_KEY:-ledgerline-bank-local-dev}
      Messaging__RabbitMq__Uri: amqp://ledgerline:${RABBITMQ_PASSWORD:-ledgerline_dev}@rabbitmq:5672/
      Auth__Mode: Oidc
      ConnectionStrings__Redis: redis:6379
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments-migrate:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck: *app-health

  risk-migrate:
    profiles: [app]
    image: ledgerline-risk:local
    build:
      context: .
      dockerfile: src/Services/Risk/Ledgerline.Risk/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=risk_db;Username=risk;Password=risk_dev
    depends_on:
      postgres: { condition: service_healthy }

  notifications-migrate:
    profiles: [app]
    image: ledgerline-notifications:local
    build:
      context: .
      dockerfile: src/Services/Notifications/Ledgerline.Notifications/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=notifications_db;Username=notifications;Password=notifications_dev
    depends_on:
      postgres: { condition: service_healthy }

  banksim-migrate:
    profiles: [app]
    image: ledgerline-banksim:local
    build:
      context: .
      dockerfile: src/Services/BankSimulator/Ledgerline.BankSimulator/Dockerfile
    command: [migrate]
    restart: "no"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=banksim_db;Username=banksim;Password=banksim_dev
    depends_on:
      postgres: { condition: service_healthy }

  risk:
    profiles: [app]
    image: ledgerline-risk:local
    build:
      context: .
      dockerfile: src/Services/Risk/Ledgerline.Risk/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=risk_db;Username=risk;Password=risk_dev
      ConnectionStrings__Redis: redis:6379
      Messaging__RabbitMq__Uri: amqp://ledgerline:${RABBITMQ_PASSWORD:-ledgerline_dev}@rabbitmq:5672/
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      risk-migrate: { condition: service_completed_successfully }
      rabbitmq-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *app-health

  notifications:
    profiles: [app]
    image: ledgerline-notifications:local
    build:
      context: .
      dockerfile: src/Services/Notifications/Ledgerline.Notifications/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=notifications_db;Username=notifications;Password=notifications_dev
      ConnectionStrings__Redis: redis:6379
      Messaging__RabbitMq__Uri: amqp://ledgerline:${RABBITMQ_PASSWORD:-ledgerline_dev}@rabbitmq:5672/
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    depends_on:
      notifications-migrate: { condition: service_completed_successfully }
      rabbitmq-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck: *app-health

  banksim:
    profiles: [app]
    image: ledgerline-banksim:local
    build:
      context: .
      dockerfile: src/Services/BankSimulator/Ledgerline.BankSimulator/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=banksim_db;Username=banksim;Password=banksim_dev
      Bank__ApiKey: ${BANK_API_KEY:-ledgerline-bank-local-dev}
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      banksim-migrate: { condition: service_completed_successfully }
    healthcheck: *app-health

  gateway:
    profiles: [app]
    image: ledgerline-gateway:local
    build:
      context: .
      dockerfile: src/Gateway/Ledgerline.Gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      accounts: { condition: service_healthy }
      payments: { condition: service_healthy }
      risk: { condition: service_healthy }
      notifications: { condition: service_healthy }
      banksim: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *app-health

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/compose/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ledgerline
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ledgerline_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ledgerline_dev}
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/compose/keycloak/ledgerline-realm.json:/opt/keycloak/data/import/ledgerline-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry Collector in one dev container.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  lgtm-data:
