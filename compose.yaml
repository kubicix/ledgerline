# Ledgerline local infrastructure. Walking skeleton: infrastructure only.
# Application services join under the "app" profile in plan task M1-T24.
# Image tags verified on 2026-11-13 (see docs/adr/0000-verified-versions.md).
# All credentials below are local development defaults, never reuse them.
name: ledgerline

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/compose/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ledgerline
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ledgerline_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ledgerline_dev}
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/compose/keycloak/ledgerline-realm.json:/opt/keycloak/data/import/ledgerline-realm.json:ro

  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry Collector in one dev container.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  lgtm-data:
