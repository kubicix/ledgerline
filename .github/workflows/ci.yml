name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Ledgerline.slnx
      - name: Build
        run: dotnet build Ledgerline.slnx --no-restore -c Release
      - name: Test
        run: dotnet test --solution Ledgerline.slnx --no-build -c Release
      - name: Validate Compose file
        run: docker compose config --quiet
