# Ledgerline chart values (ADR 0011). Everything here is a local development default that mirrors compose.yaml.
# Passwords and keys below are development values, never reuse them. A real deployment would take them from an
# external secret store instead of from this file.

# Renders only the infrastructure and the Secrets (no service Deployments, Services, ConfigMaps, PodDisruptionBudgets
# or migration Jobs). scripts/kind-deploy uses it for the first pass of a two-pass install (docs/kubernetes.md).
infraOnly: false

# Phase 2 (M5): Kafka, MongoDB, Reporting and Reconciliation, the Helm twin of compose.phase2.yaml with profile phase2.
# Off by default; with it off the chart renders exactly the M1 to M4 system. With it on, the services marked phase2: true
# are rendered, every service's phase2Env is merged over its env (Kafka publishing in Accounts and Payments, the operations
# address in Notifications), and infra.kafka, infra.mongo and the kafka-topics hook Job are rendered. Turn it on with a
# fresh install, not an upgrade of a running default release (docs/kubernetes.md, "Phase 2").
phase2:
  enabled: false

global:
  imagePullPolicy: IfNotPresent   # images are tagged :local and loaded into the cluster with kind load
  runAsUser: 1654                 # APP_UID of the Microsoft aspnet runtime images
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5          # counts inside terminationGracePeriodSeconds

# Migration Jobs (templates/service/migrate-job.yaml). Their init container waits for PostgreSQL with pg_isready, using
# the client of infra.postgres.image, so the server and the wait container share one tag. Point host and port at an
# external database when the chart does not run PostgreSQL itself (infra.postgres.enabled=false).
migrations:
  waitForDatabase:
    host: postgres
    port: 5432

# One entry per deployable service. The map key is the Deployment, Service and Compose service name.
#   image      image to run
#   replicas   pod count
#   port       container and Service port
#   migrate    true when the service owns a database and has a migration Job
#   nodePort   set only on the service exposed outside the cluster (makes its Service a NodePort)
#   env        plain settings, rendered into the <service>-config ConfigMap
#   secretEnv  settings with credentials, rendered into the <service>-secrets Secret
#   phase2     true for a Phase 2 service, rendered only with phase2.enabled
#   phase2Env  settings merged over env only with phase2.enabled (compose.phase2.yaml)
services:
  accounts:
    image: ledgerline-accounts:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      ConnectionStrings__Redis: redis:6379
      Auth__Mode: Oidc
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      ASPNETCORE_ENVIRONMENT: Development
    phase2Env:
      Messaging__Kafka__Enabled: "true"
      Messaging__Kafka__BootstrapServers: kafka:9092
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=accounts_db;Username=accounts;Password=accounts_dev;Maximum Pool Size=40
      Messaging__RabbitMq__Uri: amqp://ledgerline:ledgerline_dev@rabbitmq:5672/

  payments:
    image: ledgerline-payments:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      Bank__BaseUrl: http://banksim:8080
      ConnectionStrings__Redis: redis:6379
      Auth__Mode: Oidc
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      ASPNETCORE_ENVIRONMENT: Development
    phase2Env:
      Messaging__Kafka__Enabled: "true"
      Messaging__Kafka__BootstrapServers: kafka:9092
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=payments_db;Username=payments;Password=payments_dev;Maximum Pool Size=40
      Messaging__RabbitMq__Uri: amqp://ledgerline:ledgerline_dev@rabbitmq:5672/
      Bank__ApiKey: ledgerline-bank-local-dev

  risk:
    image: ledgerline-risk:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      ConnectionStrings__Redis: redis:6379
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=risk_db;Username=risk;Password=risk_dev;Maximum Pool Size=40
      Messaging__RabbitMq__Uri: amqp://ledgerline:ledgerline_dev@rabbitmq:5672/

  notifications:
    image: ledgerline-notifications:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      ConnectionStrings__Redis: redis:6379
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    phase2Env:
      Notifications__OperationsEmail: operations@ledgerline.test
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=notifications_db;Username=notifications;Password=notifications_dev;Maximum Pool Size=40
      Messaging__RabbitMq__Uri: amqp://ledgerline:ledgerline_dev@rabbitmq:5672/

  banksim:
    image: ledgerline-banksim:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=banksim_db;Username=banksim;Password=banksim_dev;Maximum Pool Size=40
      Bank__ApiKey: ledgerline-bank-local-dev

  gateway:
    image: ledgerline-gateway:local
    replicas: 1
    port: 8080
    migrate: false
    nodePort: 30080
    env:
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    secretEnv: {}

  # Phase 2 services (rendered only with phase2.enabled). MongoDB runs without authentication, as in compose.yaml.
  reporting:
    phase2: true
    image: ledgerline-reporting:local
    replicas: 1
    port: 8080
    migrate: false
    env:
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Reporting__Kafka__BootstrapServers: kafka:9092
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    secretEnv: {}

  reconciliation:
    phase2: true
    image: ledgerline-reconciliation:local
    replicas: 1
    port: 8080
    migrate: true
    env:
      ConnectionStrings__Redis: redis:6379
      Bank__BaseUrl: http://banksim:8080
      Reconciliation__Kafka__BootstrapServers: kafka:9092
      Auth__Authority: http://keycloak:8081/realms/ledgerline
      Auth__Audience: ledgerline-api
      Auth__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    secretEnv:
      ConnectionStrings__Database: Host=postgres;Database=reconciliation_db;Username=reconciliation;Password=reconciliation_dev;Maximum Pool Size=40
      Messaging__RabbitMq__Uri: amqp://ledgerline:ledgerline_dev@rabbitmq:5672/
      Bank__ApiKey: ledgerline-bank-local-dev

# Dev-grade, single-replica infrastructure, written by hand with the same images as compose.yaml (templates/infra/*,
# no Bitnami charts, no operators). Each component can be switched off with infra.<name>.enabled=false to use an
# external one; the Kubernetes Service names (postgres, rabbitmq, redis, keycloak, otel-lgtm, mailpit) are the host names
# the services use. Passwords are the compose.yaml development defaults: never reuse them.
#   runAsUser  the non-root uid the image runs as (also the fsGroup of its volumes)
#   resources  sized for one kind node, together with the six services (192Mi requested, 512Mi limit each)
infra:
  postgres:
    enabled: true
    image: postgres:18.7-alpine
    runAsUser: 70
    maxConnections: 300           # 5 services x 40 pooled connections = 200, plus headroom
    password: ledgerline_dev      # superuser password; the per-service logins are created by files/init-databases.sql
    storage: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # With enabled=false an external broker needs what files/local-events.json declares: the local.events queue bound to
  # accounts.event.journal-entry-posted.v1, payments.event.payment-completed.v1, payments.event.payment-failed.v1 and
  # reconciliation.event.reconciliation-completed.v1 (exchange ledgerline.reconciliation). Without these the Accounts
  # relay stalls on an unroutable event, and the Reconciliation outbox stops at its completion event (mandatory
  # publish, NO_ROUTE).
  rabbitmq:
    enabled: true
    image: rabbitmq:4.4-management
    runAsUser: 999
    user: ledgerline
    password: ledgerline_dev
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  redis:
    enabled: true
    image: redis:8.8-alpine
    runAsUser: 999
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 256Mi

  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:26.8.2
    runAsUser: 1000
    adminUser: admin
    adminPassword: ledgerline_dev
    hostname: http://localhost:8081   # KC_HOSTNAME: the issuer of every token, as in compose.yaml
    nodePort: 30081                   # mapped to host port 8081 by deploy/kind/cluster.yaml
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        memory: 1536Mi

  otelLgtm:
    enabled: true
    image: grafana/otel-lgtm:0.41.0
    runAsUser: 1000
    grafanaNodePort: 30300            # mapped to host port 3000 by deploy/kind/cluster.yaml
    # In-memory telemetry directories (compose.yaml uses tmpfs). They count toward the memory limit below.
    memoryVolumes:
      loki: 512Mi
      tempo: 512Mi
      tempoLive: 512Mi
      prometheus: 256Mi
      pyroscope: 256Mi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 4Gi                   # as in compose.yaml; the collector can still exceed it under steady load (M3)

  mailpit:
    enabled: true
    image: axllent/mailpit:v1.33.1
    runAsUser: 1000
    uiNodePort: 30025                 # mapped to host port 8025 by deploy/kind/cluster.yaml
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # Phase 2 infrastructure, rendered only with phase2.enabled (compose.yaml: kafka, kafka-init, mongo).
  # Single-node KRaft broker and controller. The broker keeps the image's default heap (1 GiB), and the readiness command
  # starts a second JVM (256 MiB) in the same container, hence the limit.
  kafka:
    enabled: true
    image: apache/kafka:4.4.0
    runAsUser: 1000
    storage: 2Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

  mongo:
    enabled: true
    image: mongo:9.0
    runAsUser: 999
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
