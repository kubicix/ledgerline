{{- if not .Values.infraOnly }}
{{- range $name, $svc := include "ledgerline.services" . | fromYaml }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "ledgerline.labels" (dict "name" $name "root" $) | nindent 4 }}
data:
  {{- range $key, $value := $svc.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
