{{- /*
One Secret per service that has credentials. Rendered in every mode, including infraOnly, because the
migration Jobs run as pre-install and pre-upgrade hooks, before any other resource of the release exists.
*/ -}}
{{- range $name, $svc := include "ledgerline.services" . | fromYaml }}
{{- if $svc.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  labels:
    {{- include "ledgerline.labels" (dict "name" $name "root" $) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $svc.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
