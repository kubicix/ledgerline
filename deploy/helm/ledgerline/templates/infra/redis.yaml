{{- /*
Redis (compose.yaml: redis), used for the in-flight leases. The append-only file is on, as in Compose. The data
directory is an emptyDir: it survives a container restart but not a pod replacement, which is accepted for
lease and cache state in this dev-grade setup.
*/ -}}
{{- $r := .Values.infra.redis }}
{{- if $r.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "ledgerline.labels" (dict "name" "redis" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ledgerline.selectorLabels" (dict "name" "redis" "root" $) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "ledgerline.labels" (dict "name" "redis" "root" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" (dict "name" "redis" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledgerline.labels" (dict "name" "redis" "root" $) | nindent 8 }}
    spec:
      securityContext:
        {{- include "ledgerline.infra.podSecurityContext" $r.runAsUser | nindent 8 }}
      containers:
        - name: redis
          image: {{ $r.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            {{- include "ledgerline.infra.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
